nodeName: "desktop-msi-z490"

postgres:
  existingSecret: postgres-secret-staging
  persistence:
    size: 2Gi
    volumeName: "family-heritage-staging-postgres-pv"
  
backend:
  existingSecret: backend-secret-staging
  image:
    tag: "staging-build"
  springProfile: staging
  persistence:
    size: 10Gi
    volumeName: "family-heritage-staging-media-pv"

frontend:
  image:
    tag: "staging-build"
  env:
    VITE_API_BASE_URL: "http://api.familyheritage.staging.192.168.100.213.nip.io"

ingress:
  enabled: true
  host: "familyheritage.staging.192.168.100.213.nip.io"
  apiHost: "api.familyheritage.staging.192.168.100.213.nip.io"